<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin: 8px;
            text-decoration: none;
        }
        .btn-dashboard {
            background: #1a73e8;
            color: #fff;
        }
        .btn-google {
            background: #fff;
            color: #3c4043;
            border: 1px solid #dadce0;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }
        .btn-google:hover { background: #f8f8f8; }
        .btn-google img { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <h1>Heart Disease Risk System</h1>

    <button class="btn btn-dashboard" type="button"
            onclick="window.location.href='{{ url_for('welcome') }}';">
        Go to Dashboard
    </button>

    <a class="btn btn-google" href="http://localhost:8000/auth/google/login">
        <!-- Google logo SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18">
