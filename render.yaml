services:
  # ─── FASTAPI PYTHON WEB SERVICE ───
  - type: web
    name: auralis-backend
    runtime: python
    region: singapore # or oregon, frankfurt
    plan: free
    rootDir: ml-core
    buildCommand: pip install -r back-end/requirements.txt
    startCommand: cd back-end && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: auralis-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Set Upstash Redis URL in dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: USE_LLM
        value: "true"
      - key: DEEPSEEK_KEY
        sync: false
      - key: Deepseek_URL
        value: "https://api.deepseek.com"
      - key: GOOGLE_CLIENT_ID
        value: "969098472980-0n6u2tbrk9j6g14je8sduu1pr19gaqum.apps.googleusercontent.com"
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

# ─── MANAGED POSTGRESQL DATABASE ───
databases:
  - name: auralis-db
    databaseName: auralis
    user: auralis_user
    region: singapore
    plan: free
